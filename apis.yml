name: Tuniu
description: 'Tuniu (途牛旅游网) is a leading online leisure travel company in China, headquartered
  in Nanjing and listed on NASDAQ under ticker TOUR. It offers packaged tours, self-guided
  tours, and a broad range of travel-related services and products including hotels, flights,
  train tickets, cruises, visas, and local activities. For partners, Tuniu runs an Open
  Platform (途牛开放平台) at developer.tuniu.com that exposes supplier and retail-partner
  integration APIs behind developer registration, letting suppliers publish inventory and
  retail partners distribute Tuniu travel products. This profile was surfaced as a portfolio
  company of DCM Ventures and enriched by the API Evangelist pipeline.'
